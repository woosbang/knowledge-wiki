name: Build and deploy wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wiki/**"
      - "pipeline/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Phase 3 에서 활성화: API 로 미분류 문서를 자동 분류한다.
      # 저장소 Settings → Secrets 에 ANTHROPIC_API_KEY 를 등록한 뒤 주석을 푼다.
      # - name: Classify new documents
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: |
      #     uv sync --extra api
      #     uv run wiki scan
      #     uv run wiki classify
      #
      # - name: Commit classification results
      #   run: |
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add wiki/
      #     git diff --staged --quiet || git commit -m "chore: 문서 자동 분류"
      #     git push

      - name: Build site
        run: uv run wiki sync

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
