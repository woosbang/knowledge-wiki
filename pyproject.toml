[project]
name = "knowledge-wiki"
version = "0.1.0"
description = "docs/ 에 HTML 을 넣기만 하면 AI 가 분류하고 위키로 배포하는 개인 지식베이스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 2: API 기반 무인 분류에만 필요
api = ["anthropic>=0.40"]

[project.scripts]
wiki = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
